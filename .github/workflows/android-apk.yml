name: Android APK

# Builds the sideloadable arm64-v8a debug APK of the standalone Tanoshi Android
# app (no Termux), uploads it as a workflow artifact and, for Android release
# tags (android-v*), publishes it on a GitHub release. Termux package releases
# use v* tags and are not touched by this workflow.
#
# The native binaries under android/app/src/main/jniLibs/arm64-v8a/ are
# prebuilt and committed, so this workflow only runs the Gradle app build - it
# needs no Rust or Android NDK toolchain. To rebuild the native pieces, see
# android/native/README.md.

on:
  push:
    branches:
      - "**"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Publishing a release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tanoshi-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Android releases are tagged android-v* (e.g. android-v0.1.0). The
      # release is created with the preinstalled GitHub CLI so the workflow
      # needs no third-party release action.
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tanoshi Android $TAG" \
            --generate-notes \
            --notes "Standalone arm64-v8a Android app that bundles and runs the Tanoshi server (no Termux). Debug-signed APK for sideloading: install it and register the first admin account in the app."
