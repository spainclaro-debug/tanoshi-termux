name: Android APK

# Builds the sideloadable arm64-v8a debug APK of the standalone Tanoshi Android
# app (no Termux), uploads it as a workflow artifact and, for Android release
# tags (android-v*), publishes it on a GitHub release. Termux package releases
# use v* tags and are not touched by this workflow.
#
# The native binaries under android/app/src/main/jniLibs/arm64-v8a/ are
# prebuilt and committed, so this workflow only runs the Gradle app build - it
# needs no Rust or Android NDK toolchain. To rebuild the native pieces, see
# android/native/README.md.

on:
  push:
    branches:
      - "**"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Publishing a release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Compute app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NAME=""
          CODE=""
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF_NAME#android-v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
            # versionCode = major*10000 + minor*100 + patch (e.g. 0.2.0 -> 200)
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "Building version '${NAME:-0.3.0 (default)}' code '${CODE:-3 (default)}'"

      - name: Build debug APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_DATE: ${{ steps.version.outputs.apk_date }}
        run: |
          chmod +x ./gradlew
          NAME="${APP_VERSION_NAME:-0.3.0}"
          CODE="${APP_VERSION_CODE:-3}"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -PappVersionName="$NAME" -PappVersionCode="$CODE" -PapkDate="$APK_DATE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tanoshi-android-debug-apk
          path: android/app/build/outputs/apk/debug/tanoshi-mobile-server-release-*.apk
          if-no-files-found: error
          retention-days: 30

      # Android releases are tagged android-v* (e.g. android-v0.1.0). The
      # release is created with the preinstalled GitHub CLI so the workflow
      # needs no third-party release action.
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="Standalone arm64-v8a Android app that bundles and runs the Tanoshi server (no Termux). Highlights of 0.3.0: share the server with other devices via a QR code on the Server screen (Expose on LAN), fixed saving the port before the first server start, plus the 0.2.0 features (catalogue infinite scroll, in-app updates, Dark/Light/Nord/Catppuccin themes, stable signing). Install: download tanoshi-mobile-server-release-<date>.apk and sideload it, then open the app, start the server and register the first admin account. Upgrading from 0.1.0 requires a one-time uninstall (0.1.0 was signed with a different key). See android/CHANGELOG.md and android/README.md."
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/tanoshi-mobile-server-release-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tanoshi Android $TAG" \
            --notes "$NOTES"
